<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Pokémon favorito - PokéAPI</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #EEF1F6;
      color: #1B2430;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #resultado {
      background: #fff;
      border: 1px solid #DDE2EA;
      border-radius: 4px;
      padding: 32px;
      text-align: center;
      max-width: 320px;
    }
    #resultado img {
      width: 140px;
    }
    #resultado h1 {
      text-transform: capitalize;
      margin: 8px 0 4px;
    }
    #resultado p {
      color: #4A5568;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="resultado">Buscando o Bulbasaur na PokéAPI...</div>

  <script src="script.js"></script>
</body>
</html>
